<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Konzeptskizze des Messinggestells in Vorder- und Seitenansicht, nicht maßstäblich">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5ce1ff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="900" height="500" rx="16" fill="#0b1530"/>
  <rect width="900" height="500" rx="16" fill="url(#grid)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="44" fill="#ffffff" font-size="20" font-weight="700">Konzeptskizze Gestell</text>
    <text x="40" y="68" fill="#8b949e" font-size="14">Nicht maßstäblich · die 1:1-Bauzeichnung folgt nach dem Ausmessen der Platinen</text>
  </g>

  <!-- ===== Vorderansicht ===== -->
  <g transform="translate(110 96)">
    <line x1="-20" y1="300" x2="300" y2="300" stroke="#59636e" stroke-dasharray="4 4"/>
    <!-- Display -->
    <rect x="70" y="20" width="140" height="190" rx="4" fill="#c0262d"/>
    <rect x="84" y="40" width="112" height="140" fill="#05070c"/>
    <g fill="#0b1530" stroke="#e6c25a" stroke-width="2">
      <circle cx="80" cy="30" r="5"/><circle cx="200" cy="30" r="5"/>
      <circle cx="80" cy="200" r="5"/><circle cx="200" cy="200" r="5"/>
    </g>
    <!-- Draht -->
    <g fill="none" stroke="#d4a73a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 300 L 58 200 L 58 30 L 80 30"/>
      <path d="M260 300 L 222 200 L 222 30 L 200 30"/>
      <path d="M58 200 L 80 200 M222 200 L 200 200"/>
    </g>
    <g fill="#d4a73a"><circle cx="20" cy="300" r="4"/><circle cx="260" cy="300" r="4"/></g>
    <text x="140" y="336" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Vorderansicht</text>
  </g>

  <!-- ===== Seitenansicht ===== -->
  <g transform="translate(520 96)">
    <line x1="-20" y1="300" x2="300" y2="300" stroke="#59636e" stroke-dasharray="4 4"/>
    <!-- Display leicht nach hinten geneigt -->
    <g transform="rotate(8 120 200)">
      <rect x="110" y="20" width="8" height="190" fill="#c0262d"/>
      <rect x="118" y="194" width="10" height="10" fill="#e6c25a"/>
    </g>
    <!-- ESP8266 dahinter, auf eigenen Drahtstützen -->
    <rect x="140" y="262" width="76" height="6" fill="#1d4a92"/>
    <rect x="160" y="255" width="34" height="7" fill="#aeb6c2"/>
    <!-- Draht -->
    <g fill="none" stroke="#d4a73a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 300 L 104 210 L 128 30"/>
      <path d="M250 300 L 124 40"/>
      <path d="M146 268 L 146 300 M210 268 L 210 300"/>
    </g>
    <g fill="#d4a73a"><circle cx="60" cy="300" r="4"/><circle cx="250" cy="300" r="4"/></g>
    <text x="140" y="336" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Seitenansicht</text>
  </g>

  <!-- Legende -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" transform="translate(40 484)">
    <rect x="0" y="-10" width="14" height="4" fill="#d4a73a"/><text x="22" y="-4">Messingdraht, tragend (Lage auf GND wird in M4 festgelegt)</text>
    <rect x="440" y="-14" width="14" height="10" fill="#c0262d"/><text x="462" y="-4">TFT-Modul</text>
    <rect x="560" y="-14" width="14" height="10" fill="#1d4a92"/><text x="582" y="-4">ESP8266-Board</text>
  </g>
</svg>
